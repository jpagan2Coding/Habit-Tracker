name: Quick Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quick-test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      MONGODB_URI: mongodb://mocked-ci-only
      MONGODB_DATABASE: Habit-Tracker_test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: false

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Run tests
      run: uv run pytest -v

    - name: Check if app starts
      run: |
        timeout 5s uv run python app.py &
        sleep 3
        echo "✅ App started successfully"
