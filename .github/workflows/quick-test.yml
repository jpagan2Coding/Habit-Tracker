name: Quick Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quick-test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      MONGODB_URI: mongodb://mocked-ci-only
      MONGODB_DATABASE: Habit-Tracker_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Python tests
        run: uv run pytest -v --ignore=tests/test_keyboard_shortcuts.py

      - name: Check if app starts
        # Run in the foreground so the app is fully stopped before the step ends.
        # A server left running holds uv's cache lock, and the "Post Install uv"
        # cleanup then waits 5 minutes and fails. Exit code 124 means the app was
        # still running when timeout stopped it; anything else means it crashed.
        run: |
          status=0
          timeout 5s uv run python app.py || status=$?
          if [ "$status" -ne 124 ]; then
            echo "App exited early with status $status"
            exit 1
          fi
          echo "App started successfully"
