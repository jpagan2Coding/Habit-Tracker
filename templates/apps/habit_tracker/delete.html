{% extends "base.html" %}

{% block title %}Delete Habit | Habit Tracker{% endblock %}

{% block content %}
<section class="mx-auto max-w-xl rounded-xl border border-slate-200 bg-white p-8">
    <h1 class="text-2xl font-bold text-slate-900">Delete Habit?</h1>

    <p class="mt-4 text-slate-600">
        Are you sure you want to delete “{{ habit.name }}”?
        This cannot be undone.
    </p>

    <form method="POST"
          action="{{ url_for('delete_habit', habit_id=habit_id) }}"
          class="mt-6 flex justify-end gap-3">
        <input type="hidden" name="csrf_token" value="{{ habit_csrf_token }}">

        <a href="{{ url_for('habit_dashboard') }}"
           class="rounded-lg border border-slate-300 px-5 py-3 font-semibold text-slate-700">
            Cancel
        </a>

        <button type="submit"
                class="rounded-lg bg-red-600 px-5 py-3 font-semibold text-white hover:bg-red-700">
            Delete Habit
        </button>
    </form>
</section>
{% endblock %}
